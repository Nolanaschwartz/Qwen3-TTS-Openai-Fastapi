# Qwen3-TTS server configuration
# Copy this file to ~/qwen3-tts/config.yaml (or point TTS_CONFIG to its location).
# The optimized backend reads this file at startup.

# Model to load on first request (must match a key in the `models` section below)
default_model: 0.6B-CustomVoice

# Fixed RNG seed for reproducible voice output. With sampling on (temperature
# 0.9), generation is random by default, so the same text sounds different each
# call. Setting a seed reseeds the RNG before every request -> identical audio
# for identical input and a stable speaker voice across requests.
# Set to null (or remove this line) to restore random/varied generation.
seed: 1234

# Sampling controls for voice stability. Defaults (if this section is absent)
# are do_sample=true, temperature=0.9 for BOTH talker and sub-talker, which makes
# the speaker timbre drift between different sentences. The sub-talker predicts
# the fine codec codes that carry timbre, so making it greedy locks the voice
# identity while the talker keeps mild sampling for natural-sounding prosody.
#   - More stable / flatter:  set do_sample: false too (fully greedy)
#   - More expressive / less stable:  raise temperatures toward 0.9
generation:
  # Talker = prosody/cadence/"life". Kept HIGH (0.65) so rhythm and intonation
  # stay lively and non-choppy. 0.5 made it flat/robotic; 0.7-0.9 = more expressive
  # but more cross-run prosody drift.
  do_sample: true           # talker (coarse codes / prosody)
  temperature: 0.65
  top_k: 30
  # Anti-loop / anti-runaway. A rare nondeterministic GPU divergence can make the
  # talker sample a repeating frame and loop, deferring EOS -> audio 5-10x too long
  # (the intermittent "dragging"). 1.05 (the generate() default) only softly
  # discourages it; 1.3 forces progress to EOS. Raise toward 1.5 if runaways
  # persist; lower toward 1.1 if speech sounds clipped/unnatural.
  repetition_penalty: 1.3
  # Sub-talker = fine codes / TIMBRE. Kept MODERATE (0.55) so the *voice identity*
  # stays consistent across runs without flattening tone (fully greedy was dull).
  # This is the lever for tonality consistency; the talker above is the lever for
  # liveliness — they move independently. Lower toward 0.45 for steadier timbre.
  subtalker_dosample: true  # sub-talker (fine codes / TIMBRE)
  subtalker_temperature: 0.45
  subtalker_top_k: 15

# Available models.  Each entry maps a short name to a HuggingFace repo id (or
# a local path) and a model type ("customvoice" or "base").
#
# - customvoice  — predefined speakers (Vivian, Ryan, …); fastest for bulk TTS
# - base         — required for voice cloning (clone: prefix) and voice library
models:
  0.6B-CustomVoice:
    hf_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    type: customvoice
  0.6B-Base:
    hf_id: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    type: base
  1.7B-CustomVoice:
    hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    type: customvoice
  1.7B-Base:
    hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    type: base

# Performance optimizations (only used with TTS_BACKEND=optimized)
optimization:
  # Attention implementation.  Options: flash_attention_2 | sdpa | eager
  # flash_attention_2 is fastest on modern GPUs; falls back to sdpa automatically.
  attention: flash_attention_2

  # cuDNN autotuning + TF32 for the conv-heavy vocoder decoder (fixed streaming
  # shapes). true is recommended; set false to A/B its effect.
  cudnn_benchmark: false

  # torch.compile mode.  Options: default | reduce-overhead | max-autotune
  # NOTE: max-autotune segfaults on this RTX 4080 (Ada, SM 8.9): its streaming
  # decode kernel needs 128KB shared memory but the card caps at 99KB
  # ("out of resource: shared memory, Required: 131072, Hardware limit: 101376").
  # reduce-overhead skips that kernel autotuning and is the recommended streaming mode.
  # "default" also works and activates the manual streaming-window CUDA graph
  # path (gated by use_cuda_graphs) but loses reduce-overhead's internal cudagraphs.
  compile_mode: reduce-overhead

  # Whether to enable torch.compile at all.  Set to false to skip compilation
  # (faster startup, lower throughput).
  use_compile: true

  # Whether to capture CUDA graphs (works on both CUDA and ROCm).
  # Required for max-autotune to reach peak performance.
  # NOTE (2026-06-22): an earlier comment claimed this corrupts streamed PCM. A
  # numeric retest (reading the stream as int16, its real dtype) found NO gross
  # corruption with compile_mode=default + use_cuda_graphs=true: clean 7s audio,
  # RMS matching the wav reference, 0% clipping. The prior "garbage" reading was a
  # float32-vs-int16 measurement error. Subtle *audible* distortion was not
  # ear-verified — listen to a stream=true pcm sample before trusting in prod.
  use_cuda_graphs: false

  # Fast codebook generation (bypasses HuggingFace generate() overhead).
  # ON: benchmarked 2026-06-22 — real RTF win (0.90->0.83x under reduce-overhead,
  # no segfault) + slightly lower TTFB. It takes a different codebook path that
  # CHANGES the audio (same text renders ~1s shorter, faster/tighter cadence), so
  # it was A/B ear-checked and the faster rendition was preferred. Set false to
  # revert to the slower, longer-cadence generation.
  use_fast_codebook: true

  # Compile the codebook predictor.
  # Off: benchmarked 2026-06-22 under reduce-overhead (no segfault) as ~zero RTF
  # benefit on its own (the codebook win comes from use_fast_codebook above), and
  # it adds warmup/compile time. Not worth it.
  compile_codebook_predictor: false

  # Streaming-specific parameters
  streaming:
    # Window size (frames) for the sliding streaming decoder.
    # AMD ROCm: use 72 (values 66/67/71 trigger a CUDA graph capture bug).
    # NVIDIA CUDA: 64, 72, or 80 all work.
    decode_window_frames: 80

    # Emit a PCM chunk every N decoded frames.  Lower = lower TTFB but slightly
    # higher RTF cost. Benchmarked 2026-06-22: 6->3 cut TTFB 0.43s->0.23s for only
    # +0.04 RTF (0.90->0.94x, still real-time) — big win for the per-sentence voice
    # agent. Raise toward 6 if you want lower RTF at the cost of first-audio latency.
    emit_every_frames: 3

    # Leading noise gate to remove the streaming decoder's cold-start junk before
    # the first phoneme (a low-freq thump at t=0 and a broadband HF "static" tick
    # right before speech). Output is muted until a short-window RMS crosses
    # onset_gate_rms (= speech onset), then ramped in over onset_attack_ms.
    #   onset_gate_rms: 0 disables; raise if leading junk leaks, lower if a soft
    #     speech onset gets clipped.
    #   onset_max_lead_ms: safety — force the gate open after this much muted lead
    #     so a too-high threshold can never swallow a whole utterance.
    onset_gate_rms: 0.05
    onset_attack_ms: 10
    onset_max_lead_ms: 2000

    # Trailing-silence suppression: the talker emits ~0.6s of silence before EOS
    # fires on short utterances, so a 0.5s "Yes." shipped as a 1.5s mostly-dead-air
    # clip (the "drag" on short voice-agent backchannels). Near-silent chunks are
    # buffered; internal pauses are preserved (flushed when speech resumes) but the
    # final trailing run is dropped, keeping tail_keep_ms of natural tail. Leading
    # silence is also skipped (not just muted) so there's no dead air before speech.
    #   tail_silence_rms: 0 disables; chunk RMS below this counts as silence.
    tail_silence_rms: 0.02
    tail_keep_ms: 120

# Server listen address and port
server:
  host: "0.0.0.0"
  port: 8880

# Built-in voice definitions (used by the /v1/voices endpoint when the optimized
# backend is active).  You can add/remove entries here freely.
voices:
